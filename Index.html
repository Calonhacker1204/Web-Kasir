<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir Modern</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0a0a0a;
    color: #eaeaea;
    padding: 20px;
    padding-bottom: 140px;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    margin-bottom: 24px;
    font-size: 26px;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .box {
    background: #141414;
    border: 1px solid #222;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }

  .box h2 {
    font-size: 14px;
    margin-bottom: 14px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  /* Search */
  .search-box {
    position: relative;
  }

  .search-box input {
    width: 100%;
    padding: 14px 16px;
    background: #0a0a0a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    color: #eaeaea;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-box input:focus {
    border-color: #4ade80;
    box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.15);
  }

  .search-box input::placeholder {
    color: #555;
  }

  /* Hasil search */
  .hasil-search {
    display: none;
    background: #0a0a0a;
    border: 1px solid #4ade80;
    border-radius: 10px;
    padding: 16px;
    margin-top: 12px;
    animation: muncul 0.3s ease;
  }

  @keyframes muncul {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hasil-search .baris {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  .hasil-search h3 {
    font-size: 17px;
    margin-bottom: 4px;
    color: #eaeaea;
  }

  .hasil-search p {
    font-size: 13px;
    color: #777;
  }

  .hasil-search .harga {
    color: #4ade80;
    font-weight: bold;
    font-size: 16px;
    margin-top: 6px;
  }

  .kontrol {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #141414;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 6px;
  }

  .kontrol button {
    width: 36px;
    height: 36px;
    border: none;
    background: #222;
    color: #eaeaea;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }

  .kontrol button:hover {
    background: #4ade80;
    color: #0a0a0a;
  }

  .kontrol .jumlah {
    min-width: 32px;
    text-align: center;
    font-weight: bold;
    font-size: 16px;
    color: #4ade80;
  }

  .btn-tambah-belanja {
    width: 100%;
    padding: 12px;
    margin-top: 14px;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    color: #0a0a0a;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .btn-tambah-belanja:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(74, 222, 128, 0.3);
  }

  .pesan-kosong {
    color: #ef4444;
    font-size: 14px;
    text-align: center;
    padding: 10px;
  }

  /* Daftar belanja */
  .item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px;
    border-bottom: 1px solid #222;
    flex-wrap: wrap;
    gap: 12px;
    transition: background 0.2s;
  }

  .item:hover {
    background: #1a1a1a;
  }

  .item:last-child {
    border-bottom: none;
  }

  .item .detail h4 {
    font-size: 15px;
    margin-bottom: 4px;
    color: #eaeaea;
  }

  .item .detail p {
    font-size: 13px;
    color: #777;
  }

  .item .detail .subtotal {
    color: #4ade80;
    font-weight: bold;
    font-size: 14px;
    margin-top: 6px;
  }

  .item .aksi {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .item .aksi button {
    width: 30px;
    height: 30px;
    border: 1px solid #2a2a2a;
    background: transparent;
    color: #eaeaea;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }

  .item .aksi button:hover {
    background: #4ade80;
    color: #0a0a0a;
    border-color: #4ade80;
  }

  .item .aksi .btn-hapus {
    border-color: #ef4444;
    color: #ef4444;
  }

  .item .aksi .btn-hapus:hover {
    background: #ef4444;
    color: #0a0a0a;
  }

  .item .aksi .jumlah-item {
    min-width: 26px;
    text-align: center;
    font-weight: bold;
    color: #4ade80;
  }

  .belum-ada {
    text-align: center;
    color: #555;
    padding: 30px;
    font-size: 14px;
  }

  /* Total */
  .total-box {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #141414;
    border-top: 1px solid #222;
    padding: 16px;
    z-index: 10;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
  }

  .total-inner {
    max-width: 700px;
    margin: 0 auto;
  }

  .total-baris {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 14px;
    color: #888;
  }

  .total-baris span:last-child {
    color: #eaeaea;
    font-weight: bold;
  }

  .total-baris.besar {
    font-size: 24px;
    font-weight: bold;
    color: #4ade80;
    margin-bottom: 14px;
  }

  .total-baris.besar span:last-child {
    color: #4ade80;
  }

  .btn-cetak {
    width: 100%;
    padding: 14px;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    color: #0a0a0a;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .btn-cetak:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(74, 222, 128, 0.3);
  }

  /* Tombol plus */
  .fab {
    position: fixed;
    bottom: 180px;
    right: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    color: #0a0a0a;
    border: none;
    font-size: 32px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(74, 222, 128, 0.5);
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s;
  }

  .fab:hover {
    transform: scale(1.1) rotate(90deg);
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.8);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.aktif {
    display: flex;
    animation: fadeIn 0.2s;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal {
    background: #141414;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    padding: 28px 24px;
    width: 100%;
    max-width: 400px;
    animation: slideUp 0.3s;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal h2 {
    font-size: 20px;
    margin-bottom: 20px;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .modal label {
    display: block;
    font-size: 13px;
    color: #888;
    margin-bottom: 6px;
  }

  .modal input {
    width: 100%;
    padding: 12px 14px;
    background: #0a0a0a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    color: #eaeaea;
    font-size: 15px;
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .modal input:focus {
    border-color: #4ade80;
    box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.15);
  }

  .modal input::placeholder {
    color: #555;
  }

  .modal .aksi {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }

  .modal .aksi button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    border: none;
    transition: transform 0.2s;
  }

  .modal .btn-batal {
    background: #222;
    color: #aaa;
  }

  .modal .btn-batal:hover {
    background: #2a2a2a;
    color: #eaeaea;
  }

  .modal .btn-simpan {
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    color: #0a0a0a;
  }

  .modal .btn-simpan:hover {
    transform: translateY(-2px);
  }

  /* Struk */
  .struk {
    display: none;
    background: #fff;
    color: #000;
    border-radius: 12px;
    padding: 24px;
    max-width: 700px;
    margin: 16px auto;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }

  .struk h2 {
    text-align: center;
    margin-bottom: 14px;
    font-size: 17px;
    letter-spacing: 2px;
  }

  .struk .garis {
    border-top: 1px dashed #999;
    margin: 10px 0;
  }

  .struk .baris {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .struk .total-akhir {
    font-weight: bold;
    font-size: 16px;
  }

  /* Responsive */
  @media (max-width: 600px) {
    h1 {
      font-size: 22px;
    }

    .hasil-search .baris {
      flex-direction: column;
      align-items: stretch;
    }

    .kontrol {
      justify-content: center;
    }

    .total-baris.besar {
      font-size: 20px;
    }
  }
</style>
</head>
<body>

<h1>Kasir Modern</h1>

<!-- Search -->
<div class="box">
  <h2>Cari Barang</h2>
  <div class="search-box">
    <input type="text" id="searchKode" placeholder="Ketik kode barang, lalu Enter...">
  </div>
  <div class="hasil-search" id="hasilSearch"></div>
</div>

<!-- Daftar belanja -->
<div class="box">
  <h2>Daftar Belanja</h2>
  <div id="daftarBelanja">
    <div class="belum-ada">Belum ada barang.</div>
  </div>
</div>

<!-- Struk -->
<div class="struk" id="struk"></div>

<!-- Tombol plus -->
<button class="fab" onclick="bukaModal()">+</button>

<!-- Total -->
<div class="total-box">
  <div class="total-inner">
    <div class="total-baris">
      <span>Total Item</span>
      <span id="totalItem">0</span>
    </div>
    <div class="total-baris besar">
      <span>Total</span>
      <span id="totalHarga">Rp 0</span>
    </div>
    <button class="btn-cetak" onclick="cetakStruk()">Cetak Struk</button>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Tambah Barang Baru</h2>

    <label>Kode Barang</label>
    <input type="text" id="inputKode" placeholder="Contoh: BRG004">

    <label>Nama Barang</label>
    <input type="text" id="inputNama" placeholder="Contoh: Kopi Sachet">

    <label>Harga (Rp)</label>
    <input type="number" id="inputHarga" placeholder="Contoh: 2000">

    <div class="aksi">
      <button class="btn-batal" onclick="tutupModal()">Batal</button>
      <button class="btn-simpan" onclick="simpanBarang()">Simpan</button>
    </div>
  </div>
</div>

<script>
  let databaseBarang = [
    { kode: "BRG001", nama: "Indomie Goreng", harga: 3500 },
    { kode: "BRG002", nama: "Aqua 600ml",     harga: 3000 },
    { kode: "BRG003", nama: "Teh Botol",      harga: 5000 }
  ];

  let daftarBelanja = [];
  let barangDicari = null;
  let jumlahSementara = 1;

  // ===== CARI BARANG =====
  function cariBarang() {
    const kode = document.getElementById("searchKode").value.trim().toUpperCase();
    const hasil = document.getElementById("hasilSearch");

    if (kode === "") {
      hasil.style.display = "none";
      return;
    }

    const barang = databaseBarang.find(function(b) {
      return b.kode.toUpperCase() === kode;
    });

    if (!barang) {
      hasil.innerHTML = '<div class="pesan-kosong">Barang dengan kode "' + kode + '" gak ditemukan.</div>';
      hasil.style.display = "block";
      barangDicari = null;
      return;
    }

    barangDicari = barang;
    jumlahSementara = 1;
    renderHasilSearch();
  }

  function renderHasilSearch() {
    const hasil = document.getElementById("hasilSearch");
    hasil.innerHTML =
      '<div class="baris">' +
        '<div class="info">' +
          '<h3>' + barangDicari.nama + '</h3>' +
          '<p>Kode: ' + barangDicari.kode + '</p>' +
          '<div class="harga">Rp ' + formatRupiah(barangDicari.harga) + '</div>' +
        '</div>' +
        '<div class="kontrol">' +
          '<button onclick="kurangJumlah()">−</button>' +
          '<span class="jumlah" id="jumlahSementara">' + jumlahSementara + '</span>' +
          '<button onclick="tambahJumlah()">+</button>' +
        '</div>' +
      '</div>' +
      '<button class="btn-tambah-belanja" onclick="tambahKeBelanja()">Tambah ke Daftar Belanja</button>';
    hasil.style.display = "block";
  }

  function tambahJumlah() {
    jumlahSementara++;
    document.getElementById("jumlahSementara").textContent = jumlahSementara;
  }

  function kurangJumlah() {
    if (jumlahSementara > 1) {
      jumlahSementara--;
      document.getElementById("jumlahSementara").textContent = jumlahSementara;
    }
  }

  function tambahKeBelanja() {
    if (!barangDicari) return;

    const indexAda = daftarBelanja.findIndex(function(b) {
      return b.kode === barangDicari.kode;
    });

    if (indexAda !== -1) {
      daftarBelanja[indexAda].jumlah += jumlahSementara;
    } else {
      daftarBelanja.push({
        kode: barangDicari.kode,
        nama: barangDicari.nama,
        harga: barangDicari.harga,
        jumlah: jumlahSementara
      });
    }

    document.getElementById("searchKode").value = "";
    document.getElementById("hasilSearch").style.display = "none";
    barangDicari = null;
    jumlahSementara = 1;

    renderDaftarBelanja();
  }

  // ===== DAFTAR BELANJA =====
  function renderDaftarBelanja() {
    const container = document.getElementById("daftarBelanja");

    if (daftarBelanja.length === 0) {
      container.innerHTML = '<div class="belum-ada">Belum ada barang.</div>';
      updateTotal();
      return;
    }

    let html = "";

    daftarBelanja.forEach(function(barang, index) {
      const subtotal = barang.harga * barang.jumlah;
      html +=
        '<div class="item">' +
          '<div class="detail">' +
            '<h4>' + barang.nama + '</h4>' +
            '<p>' + barang.kode + ' · Rp ' + formatRupiah(barang.harga) + '</p>' +
            '<div class="subtotal">Rp ' + formatRupiah(subtotal) + '</div>' +
          '</div>' +
          '<div class="aksi">' +
            '<button onclick="kurangItem(' + index + ')">−</button>' +
            '<span class="jumlah-item">' + barang.jumlah + '</span>' +
            '<button onclick="tambahItem(' + index + ')">+</button>' +
            '<button class="btn-hapus" onclick="hapusItem(' + index + ')">×</button>' +
          '</div>' +
        '</div>';
    });

    container.innerHTML = html;
    updateTotal();
  }

  function tambahItem(index) {
    daftarBelanja[index].jumlah++;
    renderDaftarBelanja();
  }

  function kurangItem(index) {
    if (daftarBelanja[index].jumlah > 1) {
      daftarBelanja[index].jumlah--;
      renderDaftarBelanja();
    }
  }

  function hapusItem(index) {
    daftarBelanja.splice(index, 1);
    renderDaftarBelanja();
  }

  // ===== TOTAL =====
  function updateTotal() {
    let totalItem = 0;
    let totalHarga = 0;

    daftarBelanja.forEach(function(barang) {
      totalItem += barang.jumlah;
      totalHarga += barang.harga * barang.jumlah;
    });

    document.getElementById("totalItem").textContent = totalItem;
    document.getElementById("totalHarga").textContent = "Rp " + formatRupiah(totalHarga);
  }

  function formatRupiah(angka) {
    return angka.toLocaleString("id-ID");
  }

  // ===== MODAL =====
  function bukaModal() {
    document.getElementById("modalOverlay").classList.add("aktif");
    document.getElementById("inputKode").value = "";
    document.getElementById("inputNama").value = "";
    document.getElementById("inputHarga").value = "";
  }

  function tutupModal() {
    document.getElementById("modalOverlay").classList.remove("aktif");
  }

  function simpanBarang() {
    const kode = document.getElementById("inputKode").value.trim().toUpperCase();
    const nama = document.getElementById("inputNama").value.trim();
    const harga = parseFloat(document.getElementById("inputHarga").value);

    if (kode === "" || nama === "" || isNaN(harga) || harga <= 0) {
      alert("Isi semua kolom dengan benar.");
      return;
    }

    const sudahAda = databaseBarang.find(function(b) {
      return b.kode.toUpperCase() === kode;
    });

    if (sudahAda) {
      alert("Kode barang udah ada.");
      return;
    }

    databaseBarang.push({ kode: kode, nama: nama, harga: harga });
    alert("Barang berhasil ditambahkan.");
    tutupModal();
  }

  // ===== CETAK STRUK =====
  function cetakStruk() {
    if (daftarBelanja.length === 0) {
      alert("Belum ada barang.");
      return;
    }

    const struk = document.getElementById("struk");
    const tanggal = new Date().toLocaleString("id-ID");

    let html = '<h2>STRUK PEMBELIAN</h2>';
    html += '<div class="baris"><span>Tanggal</span><span>' + tanggal + '</span></div>';
    html += '<div class="garis"></div>';

    let total = 0;
    daftarBelanja.forEach(function(barang) {
      const subtotal = barang.harga * barang.jumlah;
      total += subtotal;
      html += '<div class="baris"><span>' + barang.nama + '</span><span>Rp ' + formatRupiah(subtotal) + '</span></div>';
      html += '<div class="baris"><span>  ' + barang.jumlah + ' x Rp ' + formatRupiah(barang.harga) + '</span><span></span></div>';
    });

    html += '<div class="garis"></div>';
    html += '<div class="baris total-akhir"><span>TOTAL</span><span>Rp ' + formatRupiah(total) + '</span></div>';
    html += '<div class="garis"></div>';
    html += '<div class="baris"><span>Terima kasih</span><span></span></div>';

    struk.innerHTML = html;
    struk.style.display = "block";
    struk.scrollIntoView({ behavior: "smooth" });
  }

  // ===== EVENT =====
  document.getElementById("searchKode").addEventListener("keydown", function(e) {
    if (e.key === "Enter") cariBarang();
  });

  document.getElementById("modalOverlay").addEventListener("click", function(e) {
    if (e.target === this) tutupModal();
  });

  renderDaftarBelanja();
</script>

</body>
</html>
